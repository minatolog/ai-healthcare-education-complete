name: Complete project checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python scripts/prepare_data.py
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s backend -p 'test_*.py'
      - run: python -m services.diabetes_model.acceptance
      - run: python backend/build_patient_data.py --check
      - run: python data/kidney/validate_handoff.py
      - run: npx --yes pnpm@10 install --frozen-lockfile
        working-directory: frontend
      - run: npm run test:patients && npm run typecheck && npm run build
        working-directory: frontend
