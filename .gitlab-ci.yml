stages:
  - test

model_api_tests:
  image: python:3.12-slim
  stage: test
  before_script:
    - python -m pip install -r services/diabetes_model/requirements.txt
  script:
    - python -m unittest discover -s backend -p 'test_patient*.py' -v
    - python -m unittest discover -s backend -p 'test_model_api.py' -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

kidney_data_handoff_check:
  image: python:3.11-slim
  stage: test
  before_script:
    - python -m pip install -r data/kidney/requirements-data.txt
  script:
    - python -m unittest discover -s data/kidney -p 'test_validate_handoff.py' -v
    - python data/kidney/validate_handoff.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

kidney_audit_tests:
  image: python:3.11-slim
  stage: test
  script:
    - python -m unittest discover -s backend/kidney/tests/audit -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

kidney_engineering_tests:
  image: python:3.11-slim
  stage: test
  variables:
    OMP_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
    HF_HUB_OFFLINE: "1"
  before_script:
    - python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
    - python -m pip install -r backend/kidney/requirements-tested.txt
  script:
    - cd backend/kidney
    - PYTHONPATH=. python -m pytest tests learning -q
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
